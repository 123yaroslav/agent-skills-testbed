name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint, format, types, secrets
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: uv run pytest
