[project]
name = "skills-testbed"
version = "0.1.0"
description = "Testbed for regression testing of LLM agent skills on document and data tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yaroslav Rogoza" }]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "ARG",      # unused arguments
    "PTH",      # pathlib instead of os.path
    "PT",       # pytest style
    "S",        # bandit security checks
    "ERA",      # commented-out code
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
